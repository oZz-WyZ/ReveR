<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviz</title>
<link rel="icon" type="image/svg+xml" href="mascotte.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
<section id="setup" class="page" hidden>
  <div class="card setup">
    <div class="setup-brand"><span class="logo-tile"><img src="mascotte.svg" alt=""></span><span>Reviz</span></div>
    <h2 id="setup-title"></h2>
    <p id="setup-aide" class="note"></p>
    <div id="setup-body"></div>
    <div class="setup-nav">
      <button id="setup-back" type="button" class="ghost">Retour</button>
      <button id="setup-next" type="button" class="primary">Continuer</button>
    </div>
  </div>
</section>
<section id="home" hidden>
  <div class="hero" id="hero">
    <div class="hero-brand"><span class="logo-tile"><img src="mascotte.svg" alt=""></span><span>Reviz</span></div>
    <h2>Mes cours</h2>
    <p class="hero-sub">Dépose ton cours ici (PDF, JPEG ou PNG), ou clique sur « Nouveau cours ».</p>
    <button id="new-course" type="button" class="primary">Nouveau cours</button>
    <input id="file" type="file" accept="application/pdf,image/jpeg,image/png" hidden>
  </div>
  <div id="subjects" class="subjects"></div>
</section>
<section id="matiere-page" hidden>
  <div class="toolbar"><button id="matiere-back" type="button" class="ghost">← Retour à l'accueil</button></div>
  <h2 id="matiere-title" class="page-title"></h2>
  <div id="lib-list"></div>
</section>
<div id="fiche" hidden>
  <div class="toolbar">
    <button id="back" type="button" class="ghost">← Retour à l'accueil</button>
    <span class="spacer"></span>
    <button id="fiche-matiere" type="button" class="chip" title="Changer de matière">
      <span id="fiche-matiere-nom"></span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div id="workspace">
    <section class="pane" id="pane-texte">
      <div class="pane-body viewer-shell">
        <div class="viewer-tools">
          <button id="edit-text" type="button" class="primary" hidden>Corriger le texte</button>
          <span id="view-seg" class="tabs" role="group" aria-label="Affichage du cours" data-active="original" hidden>
            <button type="button" id="view-original">Origine</button>
            <button type="button" id="view-texte">Texte</button>
          </span>
        </div>
        <div class="viewer-scroll">
          <section id="doc">
            <p id="doc-note" class="note" hidden></p>
            <div id="pdf-view" hidden></div>
            <div id="reader" aria-label="Texte du cours"></div>
            <button id="ask-btn" type="button" hidden>Poser une question sur ce passage</button>
            <form id="ask-pop" hidden>
              <input id="ask-input" placeholder="Ta question sur ce passage…" autocomplete="off" required>
              <button>Envoyer</button> <button type="button" id="ask-cancel">Annuler</button>
              <span id="ask-status" role="status"></span>
            </form>
            <div id="cards" class="popover" hidden></div>
            <section id="orphans" hidden><h3>Commentaires sans passage</h3><div id="orphans-list"></div></section>
          </section>
        </div>
      </div>
    </section>
    <section class="pane" id="pane-assistant">
      <div class="pane-body assistant-card">
        <header class="assistant-head">
          <span class="tabs" role="tablist" aria-label="Assistant" data-active="chat">
            <button id="tab-chat" type="button" role="tab" aria-selected="true">Reviz</button>
            <button id="tab-quiz" type="button" role="tab" aria-selected="false">Me tester</button>
          </span>
        </header>
        <section id="quiz" class="quiz-box" hidden>
          <div id="quiz-loading" class="dots" role="status" aria-label="Chargement du quiz" hidden><i></i><i></i><i></i></div>
          <p id="quiz-status" role="status"></p>
          <div id="quiz-run" hidden>
            <h3 id="quiz-q"></h3>
            <div id="quiz-options"></div>
            <div id="quiz-feedback" hidden></div>
          </div>
          <div id="quiz-result" hidden></div>
        </section>
        <section id="chat" class="chat-box" hidden>
          <div id="chat-empty" class="chat-empty">
            <img class="orb" src="mascotte.svg" alt="">
            <h2>Que veux-tu savoir sur ce cours ?</h2>
            <p class="note">Je réponds d'après ton cours et je cite le passage utilisé.</p>
            <div id="chat-suggest" class="suggest"></div>
          </div>
          <div id="chat-log" aria-live="polite"></div>
          <p id="chat-status" role="status"></p>
          <form id="chat-form" class="composer">
            <input id="chat-input" placeholder="Pose une question sur ton cours…" autocomplete="off" required>
            <button id="chat-mic" type="button" aria-label="Dicter ta question" aria-pressed="false" title="Dicter ta question" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <button id="chat-send" aria-label="Envoyer">↑</button>
          </form>
        </section>
      </div>
    </section>
  </div>
</div>

</main>
<div id="chooser" hidden></div>
<div id="toasts" aria-live="polite"></div>
<button id="reset" type="button" class="ghost reset-fixed">Reset</button>
<script type="module" src="src/main.js"></script>
</body>
</html>
