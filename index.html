<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviz</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
  #drop { border: 2px dashed #999; border-radius: 8px; padding: 1.5rem; text-align: center; }
  #drop.over { border-color: #06c; background: #eef5ff; }
  #reader { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; min-height: 8rem; margin: .5rem 0; }
  #doc { position: relative; }
  #ask-btn, #ask-pop { position: absolute; z-index: 5; background: #fff; border: 1px solid #06c; border-radius: 6px; padding: .35rem .5rem; box-shadow: 0 2px 8px #0003; }
  #ask-btn { color: #06c; cursor: pointer; font: inherit; font-size: .9rem; }
  #ask-input { font: inherit; width: 18rem; max-width: 70vw; }
  #ask-status.err { color: #b00; }
  mark { background: #ffe066; cursor: pointer; border-radius: 2px; } mark.multi { background: #ffc233; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: .5rem .75rem; margin: .5rem 0; background: #fafafa; }
  .card blockquote { margin: .25rem 0 .5rem; padding: .5rem .75rem; border-left: 4px solid #e0a800; background: #fff6d6; font-style: italic; }
  .card p { margin: .25rem 0; } .card .ask { color: #555; font-size: .9rem; }
  #status, #info { color: #555; font-size: .9rem; }
  #status.err { color: #b00; }
  #ob-form label { display: block; } #ob-form input, #ob-form select { font: inherit; }
  #ob-warn { color: #b60; }
  #chat-log { display: flex; flex-direction: column; gap: .5rem; margin: .5rem 0; }
  .msg { padding: .5rem .75rem; border-radius: 8px; max-width: 85%; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #e8f0fe; }
  .msg.bot { align-self: flex-start; background: #f4f4f4; }
  .msg p { margin: .25rem 0; } .msg blockquote { margin: .25rem 0 .5rem; padding: .5rem .75rem; border-left: 4px solid #2e7d32; background: #eaf5ec; color: #222; font-style: italic; }
  .badge { font-size: .75rem; padding: .1rem .5rem; border-radius: 999px; }
  .badge.cours { background: #d7f0dc; } .badge.general { background: #fde8c8; }
  .tag, .note { font-size: .8rem; color: #666; }
  .fb button { background: none; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
  .fb button[aria-pressed="true"] { border-color: #06c; background: #eef5ff; }
  #chat-form { display: flex; gap: .5rem; } #chat-input { flex: 1; font: inherit; padding: .4rem; }
  #chat-status.err { color: #b00; }
  #docs button { margin: 0 .25rem .25rem 0; }
</style>
</head>
<body>
<h1>Reviz</h1>
<div id="drop">
  <p>Glisse un cours ici (PDF, JPEG, PNG) ou</p>
  <label><button type="button" onclick="this.nextElementSibling.click()">Choisir un fichier</button>
  <input id="file" type="file" accept="application/pdf,image/jpeg,image/png" hidden></label>
</div>
<p id="status" role="status"></p>
<div id="docs"></div>
<section id="doc" hidden>
  <h2 id="title"></h2>
  <p id="info"></p>
  <div id="reader" aria-label="Texte du cours"></div>
  <button id="ask-btn" type="button" hidden>Poser une question sur ce passage</button>
  <form id="ask-pop" hidden>
    <input id="ask-input" placeholder="Ta question sur ce passage…" autocomplete="off" required>
    <button>Envoyer</button> <button type="button" id="ask-cancel">Annuler</button>
    <span id="ask-status" role="status"></span>
  </form>
  <button id="save">Valider</button> <button id="edit-text" type="button" hidden>Corriger le texte</button>
  <div id="cards"></div>
  <section id="orphans" hidden><h3>Commentaires sans passage</h3><div id="orphans-list"></div></section>
</section>
<section id="onboarding" hidden>
  <h2>À propos de ce cours</h2>
  <p id="ob-status" role="status"></p>
  <form id="ob-form">
    <p><label>Matière <input id="ob-matiere" required></label></p>
    <p><label>Sujet <input id="ob-sujet" required></label></p>
    <p><label>Niveau
      <select id="ob-niveau" required>
        <option value="">—</option><option>collège</option><option>lycée</option><option>supérieur</option>
      </select></label></p>
    <p><label>Échéance du devoir (facultatif) <input id="ob-echeance" type="date"></label>
      <span id="ob-warn"></span></p>
    <button>Confirmer</button>
  </form>
  <button id="ob-regen" hidden>Réessayer la configuration de l'assistant</button>
</section>
<section id="chat" hidden>
  <h2>Pose tes questions sur le cours</h2>
  <div id="chat-log" aria-live="polite"></div>
  <p id="chat-status" role="status"></p>
  <form id="chat-form">
    <input id="chat-input" placeholder="Ta question…" autocomplete="off" required>
    <button id="chat-send">Envoyer</button>
  </form>
</section>
<script type="module" src="src/main.js"></script>
</body>
</html>
